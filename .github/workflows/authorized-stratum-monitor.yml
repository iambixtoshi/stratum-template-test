name: Authorized Luxor Stratum monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: authorized-luxor-stratum
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      LUXOR_USER: ${{ secrets.LUXOR_USER }}
      LUXOR_PASSWORD: ${{ secrets.LUXOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect authorized Stratum jobs
        if: env.LUXOR_USER != ''
        env:
          DURATION: "1800"
          PAIR_WINDOW: "45"
        run: python3 stratum_monitor.py
      - name: Commit timestamped Stratum evidence
        if: env.LUXOR_USER != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/stratum
          git diff --cached --quiet && exit 0
          git commit -m "Record authorized Luxor Stratum sample"
          git push
